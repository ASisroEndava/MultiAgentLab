services:
  backend:
    build:
      context: ./src/Api
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend
